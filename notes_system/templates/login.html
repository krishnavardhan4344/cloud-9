{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="form-card">
  <h1>Log in</h1>
  <form method="post" novalidate>
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label for="username">Username</label>
    <input id="username" name="username" required autocomplete="username" autofocus>
    <label for="password">Password</label>
    <div class="pw-row">
      <input id="password" type="password" name="password" required autocomplete="current-password">
      <button type="button" class="btn btn-sm btn-outline" data-toggle-password="password">Show</button>
    </div>
    <button class="btn btn-block" type="submit">Log in</button>
  </form>
  <p class="alt">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
