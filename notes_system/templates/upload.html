{% extends "base.html" %}
{% block title %}Upload a note{% endblock %}
{% block content %}
<section class="form-card wide">
  <h1>Upload a note</h1>
  <form method="post" enctype="multipart/form-data" id="uploadForm" data-max-mb="{{ max_mb }}" data-exts="{{ allowed_exts|join(',') }}" novalidate>
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">

    <label for="title">Title</label>
    <input id="title" name="title" value="{{ form.title or '' }}" required minlength="3" maxlength="100" placeholder="Unit 2: Heat engines">

    <div class="two-col">
      <div>
        <label for="department">Department</label>
        <select id="department" name="department" required>
          <option value="">Choose department</option>
          {% for d in departments %}<option value="{{ d }}" {% if form.department == d %}selected{% endif %}>{{ d }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label for="semester">Semester (optional)</label>
        <select id="semester" name="semester">
          <option value="">Not specified</option>
          {% for s in semesters %}<option value="{{ s }}" {% if form.semester == s|string %}selected{% endif %}>Semester {{ s }}</option>{% endfor %}
        </select>
      </div>
    </div>

    <label for="subject">Subject</label>
    <input id="subject" name="subject" value="{{ form.subject or '' }}" required minlength="2" maxlength="60" placeholder="Thermodynamics">

    <label for="description">Description (optional)</label>
    <textarea id="description" name="description" rows="3" maxlength="300" placeholder="What does this cover?">{{ form.description or '' }}</textarea>

    <label for="file">File</label>
    <input id="file" type="file" name="file" required accept=".{{ allowed_exts|join(',.') }}">
    <small>Allowed: {{ allowed_exts|join(', ') }}. Up to {{ max_mb }} MB.</small>
    <p class="file-info" id="fileInfo" aria-live="polite"></p>

    <button class="btn btn-block" type="submit">Upload note</button>
  </form>
</section>
{% endblock %}
